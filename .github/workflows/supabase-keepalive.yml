# Keeps the free-plan Supabase project (petersfhs-study) from being paused for inactivity.
# Every day this calls the pfhs_keepalive() function, which writes a timestamp to the keepalive table.
# The key below is the public "publishable" key (the same one the website ships with); it can only call the
# sign-in/progress functions. If the ping ever fails, GitHub emails the repo owner about the failed run.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 9 * * *"   # every day at 09:17 UTC
  workflow_dispatch:         # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            -X POST "https://ukhohosfxtldbqciigxz.supabase.co/rest/v1/rpc/pfhs_keepalive" \
            -H "apikey: sb_publishable_Q2r_8tBfB4TMhoHxaivzjw_Tppbbfxx" \
            -H "Content-Type: application/json" \
            -d '{}'
